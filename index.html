<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1512">
<meta name="description" content="Khorne Chaos Cult gang builder, battle tracker and searchable rules for Necromunda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skin & Sinew">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Skin and Sinew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with three route tabs; builder = settings rail + fighter cards; play = tracker strip, articles, fighter cards; rules = searchable codex */
:root{
  --bg:#e8e4e1; --surface:#f6f3f1; --sunk:#ddd7d2; --line:#c9bfb8; --fg:#24140f; --muted:#6c5a51;
  --blood:#9b1c14; --blood-soft:#9b1c1418; --brass:#86651f; --brass-soft:#86651f22;
  --ok:#2f6b3a; --warn:#9a5b06; --err:#a3170f;
  --display:"Pirata One","UnifrakturCook",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150e0c; --surface:#1f1512; --sunk:#2a1d18; --line:#3d2b24; --fg:#ece2d4; --muted:#a8968a;
  --blood:#d6443a; --blood-soft:#d6443a22; --brass:#cfa85c; --brass-soft:#cfa85c22;
  --ok:#6cbf7a; --warn:#e2a54a; --err:#ee6157; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e0c; --surface:#1f1512; --sunk:#2a1d18; --line:#3d2b24; --fg:#ece2d4; --muted:#a8968a;
  --blood:#d6443a; --blood-soft:#d6443a22; --brass:#cfa85c; --brass-soft:#cfa85c22;
  --ok:#6cbf7a; --warn:#e2a54a; --err:#ee6157; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.9rem;line-height:1.1}
h3{font-size:1.35rem}
p{margin:0}
a{color:var(--blood)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:2rem;line-height:1;color:var(--blood)}
.brand small{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem}
.tabs a[aria-current="page"]{background:var(--blood);color:#fff}
main{padding-block:20px 60px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.2}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--err);border-color:var(--err)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;font-family:var(--mono);font-size:.78rem}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.92rem}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.blood{background:var(--blood-soft);color:var(--blood)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* builder layout */
.builder{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.builder{grid-template-columns:minmax(0,1fr)}.rail{position:static}}
.budget{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.budget i{display:block;height:100%;background:var(--brass)}
.budget.over i{background:var(--err)}
.big{font-family:var(--mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.issues{display:flex;flex-direction:column;gap:6px;font-size:.9rem;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start}
.issues li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px;background:var(--ok)}
.issues li.err::before{background:var(--err)}
.issues li.warn::before{background:var(--warn)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.addgrid button{text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px}
.addgrid button span{font-size:.76rem;color:var(--muted);font-weight:500}

/* fighter cards */
.cards{display:flex;flex-direction:column;gap:12px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fc.leader{border-color:var(--brass)}
.fch{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:linear-gradient(90deg,var(--blood-soft),transparent 70%)}
.fch .nm{font-family:var(--display);font-size:1.45rem;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.fch .ty{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.fch .cost{margin-left:auto;font-family:var(--mono);font-weight:600;white-space:nowrap}
.fch .chev{color:var(--muted);transition:transform .15s}
.fc.open .fch .chev{transform:rotate(90deg)}
.fcb{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto;max-width:100%}
.stats{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;min-width:100%}
.stats th{font-size:.66rem;color:var(--muted);font-weight:600;padding:2px 4px;text-align:center;border-bottom:1px solid var(--line)}
.stats td{text-align:center;padding:4px;font-weight:600}
.stats td.mod{color:var(--blood)}
.stats td.hurt{color:var(--err);text-decoration:underline}
.wtab{border-collapse:collapse;font-size:.8rem;width:100%}
.wtab th{font-size:.66rem;color:var(--muted);text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.wtab td{padding:4px 5px;border-bottom:1px solid var(--sunk);vertical-align:top}
.wtab td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.wtab td:first-child{font-weight:700;white-space:nowrap}
.wtab td.tr{min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 4px 3px 10px;font-size:.85rem}
.chip b{font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--muted)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1}
.chip button:hover{background:var(--blood-soft);color:var(--blood)}
.sub{display:flex;flex-direction:column;gap:6px}
.rd{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.rd summary{cursor:pointer;padding:5px 10px;font-weight:700;font-size:.88rem;list-style:none}
.rd summary::-webkit-details-marker{display:none}
.rd summary::before{content:"+ ";color:var(--brass)}
.rd[open] summary::before{content:"– "}
.rd p,.rd div.t{padding:0 10px 8px;font-size:.9rem}
.rules-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}

/* play */
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:var(--r);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:4px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.counter{display:flex;align-items:center;justify-content:space-between;gap:8px}
.counter .big{min-width:2ch;text-align:center}
.step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800;font-size:1.1rem}
.step:hover{border-color:var(--brass)}
.pool{font-family:var(--display);font-size:3rem;line-height:.9;color:var(--blood)}
.dice{display:flex;flex-wrap:wrap;gap:5px}
.die{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;border:1px solid var(--line);background:var(--bg)}
.die.hit{background:var(--blood);border-color:var(--blood);color:#fff}
.result{border-left:3px solid var(--brass);padding:8px 12px;background:var(--brass-soft);border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.result.fail{border-color:var(--err);background:var(--blood-soft)}
.result.pass{border-color:var(--ok)}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.art{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:5px}
.art.used{opacity:.5}
.art h4{margin:0;font-family:var(--body);font-weight:800;font-size:.95rem;font-style:italic}
.art .thr{font-family:var(--mono);font-weight:600;color:var(--blood)}
.art p{font-size:.86rem}
.art .f{color:var(--muted)}
.tk{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.tc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tc.st-pinned{border-left:4px solid var(--warn)}
.tc.st-si{border-left:4px solid var(--err)}
.tc.st-broken{border-left:4px solid var(--warn)}
.tc.st-ooa{opacity:.55;border-left:4px solid var(--muted)}
.tc.st-out{opacity:.4}
.tc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tc .hd strong{font-family:var(--display);font-size:1.3rem;font-weight:400}
.fw{display:inline-flex;align-items:center;gap:6px}
.card-back{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.suit{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--blood)}

/* rules codex */
.codex{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.toc a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:4px}
.toc a:hover{background:var(--sunk);color:var(--fg)}
@media (max-width:860px){.codex{grid-template-columns:minmax(0,1fr)}.toc{position:static;flex-direction:row;flex-wrap:wrap}}
.csec{display:flex;flex-direction:column;gap:12px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px;scroll-margin-top:90px}
.rb{display:flex;flex-direction:column;gap:6px;max-width:78ch}
.rb.wide{max-width:none}
.rb h3{color:var(--blood)}
.rb ul,.rb ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.dt{border-collapse:collapse;font-size:.86rem;width:100%}
.dt th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:5px 7px;border-bottom:1px solid var(--sunk);vertical-align:top}
.dt td.c{text-align:center;font-family:var(--mono)}
.dt tr.grp td{font-weight:800;color:var(--brass);background:var(--sunk);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.tick{color:var(--blood);font-weight:800}
.search{width:100%;font-size:1rem;padding:10px 12px}
.hidden-by-search{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;z-index:50;font-size:.9rem}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-3px,1px) rotate(-2deg)}40%{transform:translate(3px,-1px) rotate(2deg)}60%{transform:translate(-2px,0) rotate(-1deg)}80%{transform:translate(2px,1px) rotate(1deg)}}
.brand h1{cursor:default;user-select:none}.brand h1.quake{animation:quake .3s 3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Skin and Sinew</h1><small>Chaos Cult · Khorne</small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#build" data-route="build">Gang</a>
      <a href="#play" data-route="play">Play</a>
      <a href="#rules" data-route="rules">Rules</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================== DATA ============================== */
const STATK=['M','WS','BS','S','T','W','I','A','Ld','Cl','WP','Int'];
const TN=new Set(['WS','BS','I','Ld','Cl','WP','Int']);

const FT={
apostle:{n:'Apostle',role:'Leader',cost:90,max:1,code:'A',st:[5,3,3,3,3,2,4,3,6,6,6,7],mark:1,hier:1,mut:[0,1],free:1,P:['Brawn','Combat','Ferocity','Savagery'],S:['Leadership','Heresy','Mutation'],rules:['Gang Leader','Gang Hierarchy (Leader)','Group Activation (2)','The Eightfold Path','Devotion','Amaranthine'],equip:'Can use any weapon. Buys from the Apostle list, Trading Post or Black Market.'},
disciple:{n:'Disciple',role:'Champion',cost:60,max:99,code:'D',st:[5,4,4,3,3,2,4,2,7,6,8,8],mark:1,hier:1,champ:1,mut:[0,1],free:1,P:['Brawn','Combat','Ferocity'],S:['Savagery','Heresy','Mutation'],rules:['Gang Hierarchy (Champion)','Group Activation (1)','Deranged Zeal'],equip:'Can use any weapon. Buys from the Disciple list, Trading Post or Black Market.'},
sorcerer:{n:'Sorcerer',role:'Champion',cost:75,max:2,code:'S',st:[5,5,4,3,3,2,3,2,8,6,7,6],mark:1,hier:1,champ:1,mut:[0,0],wyrd:1,P:['Ferocity','Aetheric Wyrd Powers'],S:['Agility','Combat','Savant','Heresy'],rules:['Gang Hierarchy (Champion)','Inured to Insanity','Power Over Prayer','Blood Magic','Idiosyncratic','Unsanctioned Psyker'],equip:'Pistols and Close Combat Weapons only.'},
mutantlord:{n:'Mutant Lord',role:'Champion',cost:110,max:1,code:'L',st:[5,3,4,5,4,2,4,3,8,6,7,8],mark:1,hier:1,champ:1,mut:[1,3],free:1,P:['Combat','Ferocity','Savagery','Mutation'],S:['Brawn','Heresy'],rules:['Gang Hierarchy (Mutant Lord)','Prophet of Deformity'],equip:'Can use any weapon. Buys from the Mutant Lord list, Trading Post or Black Market.'},
mutant:{n:'Mutant',role:'Ganger',cost:45,max:4,code:'M',st:[5,4,5,3,4,1,4,2,10,7,8,9],gf:1,mut:[1,2],spec:1,P:['Combat','Ferocity','Mutation'],S:['Cunning','Savagery','Heresy'],rules:['Gang Fighter (Ganger)','Promotion (Mutant Specialist)','Devotee of Deformity'],equip:'Pistols, Basic and Close Combat Weapons. A Specialist can also use Special Weapons.'},
chosen:{n:'Chosen',role:'Prospect',cost:45,max:3,code:'C',st:[5,3,5,4,3,1,4,1,7,7,7,8],gf:1,mut:[0,0],P:['Combat','Heresy'],S:['Ferocity','Leadership','Savagery'],rules:['Berserker','Gang Fighter (Prospect)','Promotion (Champion)','Hot-Headed','Fast Learner','Eye of the Gods'],equip:'Anything on the Chosen list. Only Pistols or Close Combat Weapons from the Trading Post or Black Market.'},
cultist:{n:'Cultist',role:'Ganger',cost:35,max:99,code:'U',st:[5,4,4,3,3,1,4,1,8,7,8,8],gf:1,mut:[0,0],spec:1,P:['Ferocity'],S:['Combat','Savagery','Heresy','Mutation'],rules:['Gang Fighter (Ganger)','Promotion (Cultist Specialist)'],equip:'Pistols, Basic and Close Combat Weapons. A Specialist can also use Special and Heavy Weapons.'},
acolyte:{n:'Acolyte',role:'Juve',cost:20,max:99,code:'J',st:[6,5,5,3,3,1,4,2,9,8,9,10],gf:1,mut:[0,0],P:['Ferocity'],S:['Agility','Combat'],rules:['Gang Fighter (Juve)','Promotion (Acolyte)','Fast Learner','Insidious Infestation'],equip:'Weapons from the Acolyte list only.'},
ogryn:{n:'Corrupted Ogryn',role:'Brute',cost:210,max:1,code:'',st:[5,3,5,5,5,3,4,3,7,6,8,9],brute:1,mut:[0,2],P:['Brawn','Ferocity','Savagery'],S:['Combat','Mutation'],rules:['Juggernaut','Murderous Brute','Slow-Witted'],equip:'Two Open Fists by default. Options below.'},
daemon:{n:'Daemon',role:'Brute',cost:250,max:1,code:'',st:[6,3,4,4,4,3,4,3,9,4,6,7],mark:1,brute:1,rep:8,mut:[0,0],P:['Combat','Ferocity','Savagery'],S:['Brawn','Mutation'],rules:['Immaterial Member','Juggernaut','Terrifying','Incorporeal','Instability','Warp Denizen','Manifestation of Chaos','Mark of Chaos'],equip:'Vorpal Claws and Warpfire Breath.'},
};
FT.scrunt={n:'Scrunt Nathan',role:'Wretch',cost:1,max:1,code:'',st:[3,6,6,1,1,1,6,1,12,12,12,12],mut:[0,0],P:['Nothing'],S:['Nothing'],rules:['Snivelling Coward','Beneath Contempt','Grovel','Scrunt Happens','Faithless','Ritual Fodder','Absolutely Not a Chaos Spawn'],equip:'Armed with a Sharpened Spoon. Cannot be given any other weapons or equipment; he drops them.',secret:1};
const ALLORDER=['apostle','disciple','sorcerer','mutantlord','mutant','chosen','cultist','acolyte','ogryn','daemon','scrunt'];
const ORDERF=()=>ALLORDER.filter(t=>t!=='scrunt'||G.scrunt);

const RULES={
'Gang Leader':`A gang must always include one. This fighter may not retire. If they die or are lost, another fighter is promoted and gains this rule.`,
'Gang Hierarchy (Leader)':`If the gang is Bottling and this fighter passes Cool, all friendly Chaos Cult fighters within 12" automatically pass. Can perform Post-Battle Actions.`,
'Gang Hierarchy (Champion)':`If the gang is Bottling and this fighter passes Cool, all friendly Chaos Cult fighters within 6" automatically pass. Can perform Post-Battle Actions.`,
'Gang Hierarchy (Mutant Lord)':`If the gang is Bottling and this fighter passes Cool, only friendly Mutant fighters within 6" automatically pass. Can perform Post-Battle Actions.`,
'Group Activation (2)':`When this fighter activates, they may also activate two Ready fighters within 3". Announce at the start; resolve each activation fully, in any order. One Group Activation per gang per turn.`,
'Group Activation (1)':`When this fighter activates, they may also activate one Ready fighter within 3". Announce at the start. One Group Activation per gang per turn.`,
'The Eightfold Path':`The Apostle chooses the gang's Unholy Dedication and Path of Damnation.`,
'Devotion':`Friendly fighters within 6" and line of sight may use the Apostle's Cool and Willpower instead of their own.`,
'Amaranthine':`If this fighter suffers a Memorable Death, a random gang fighter suffers it instead as a Sacrifice; the Apostle then takes the Enfeebled Lasting Injury and the Crooked Body Mutation. This fighter cannot be Captured: a random fighter is captured instead.`,

'Promotion (Cultist Specialist)':`At founding, one Ganger (Cultist or Mutant) can be a Specialist; in a campaign, via an Advancement. A Specialist may spend XP on skills and can use Special and Heavy Weapons.`,

'Berserker':`When making close combat attacks as part of a successful Charge (Double), gains +1 Attack.`,

/* ============================== HELPERS ============================== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d6=()=>1+Math.floor(Math.random()*6);
const fmt=(k,v)=>k==='M'?v+'"':TN.has(k)?v+'+':String(v);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function stats(f){const T=FT[f.type];const o={};STATK.forEach((k,i)=>o[k]=T.st[i]);
 if(T.mark){o.WS=Math.max(2,o.WS-1);o.BS=Math.min(6,o.BS+2);o.Cl=Math.max(2,o.Cl-2)}
 (f.muts||[]).forEach(m=>{if(m==='Vast Bulk')o.W++;if(m==='Extra Appendages')o.A++});return o}
function baseStats(type){const o={};STATK.forEach((k,i)=>o[k]=FT[type].st[i]);return o}
function cost(f){const T=FT[f.type];let c=T.cost;(f.items||[]).forEach(n=>c+=EQ[n]?EQ[n].c:0);(f.muts||[]).forEach(n=>c+=MUTS[n]?MUTS[n].c:0);
 if(T.wyrd)c+=Math.max(0,(f.wyrd||[]).length-1)*30;if(f.psyker)c+=30;
 if(f.type==='ogryn'){(f.hands||[]).forEach(h=>c+=h==='Power Maul'?30:h==='Horrific Appendages'?20:0);if(f.plate)c+=15}
 return c}
const gangCost=()=>G.fighters.reduce((s,f)=>s+cost(f),0);
function itemCount(n){let k=0;G.fighters.forEach(f=>(f.items||[]).forEach(i=>{if(i===n)k++}));return k}
function weaponsOf(f){const out=[];
 if(f.type==='ogryn'){(f.hands||['Open Fist','Open Fist']).forEach(h=>out.push([h,WP[h]]))}
 if(f.type==='daemon'){out.push(['Vorpal Claws',WP['Vorpal Claws']],['Warpfire Breath',WP['Warpfire Breath']])}
 if(f.type==='scrunt'){out.push(['Sharpened Spoon',WP['Sharpened Spoon']])}
 (f.items||[]).forEach(n=>{const e=EQ[n];if(e&&e.p&&e.p.length)e.p.forEach(p=>out.push([p,WP[p]]))});
 const seen=new Set();return out.filter(([n])=>{if(n==='Polearm'&&seen.has(n))return false;seen.add(n);return true})}
function gearOf(f){return (f.items||[]).filter(n=>EQ[n]&&!(EQ[n].p&&EQ[n].p.length))}
function wtable(rows,note){if(!rows.length)return '<p class="muted">Unarmed only.</p>';
 return `<div class="scroll"><table class="wtab"><thead><tr><th>Weapon</th><th>S</th><th>L</th><th>S</th><th>L</th><th>Str</th><th>AP</th><th>D</th><th>Am</th><th>Traits</th></tr></thead><tbody>${rows.map(([n,p])=>`<tr><td>${esc(n)}</td>${p.slice(0,8).map(v=>`<td class="n">${esc(v)}</td>`).join('')}<td class="tr">${esc(p[8])}</td></tr>`).join('')}</tbody></table></div>`}
function statTable(o,base,hurt={}){return `<div class="scroll"><table class="stats"><thead><tr>${STATK.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody><tr>${STATK.map(k=>{let v=o[k];let cls=base&&base[k]!==o[k]?'mod':'';if(hurt[k]!=null){v=hurt[k];cls='hurt'}return `<td class="${cls}">${fmt(k,v)}</td>`}).join('')}</tr></tbody></table></div>`}
function ruleDetails(names){return `<div class="rules-list">${names.map(n=>`<details class="rd"><summary>${esc(n)}</summary><p>${esc(RULES[n]||'')}</p></details>`).join('')}</div>`}

/* ============================== VALIDATION ============================== */
function validate(){const I=[];const fs=G.fighters;const cnt=t=>fs.filter(f=>f.type===t).length;
 const ap=cnt('apostle');if(ap!==1)I.push(['err',ap?'Only one Apostle allowed.':'The gang needs an Apostle (Gang Leader).']);
 const hier=fs.filter(f=>FT[f.type].hier).length,gf=fs.filter(f=>FT[f.type].gf).length,champs=fs.filter(f=>FT[f.type].champ).length;
 if(hier>gf)I.push(['err',`Leader and Champions (${hier}) outnumber Gang Fighters (${gf}).`]);
 if(G.founding&&champs>2)I.push(['err',`Only 2 Champions at founding (you have ${champs}).`]);
 ALLORDER.forEach(t=>{const T=FT[t];if(T.max<99&&cnt(t)>T.max)I.push(['err',`${T.n}: limit ${T.max} (you have ${cnt(t)}).`])});
 const total=gangCost();if(total>G.budget)I.push(['err',`Over budget by ${total-G.budget} credits.`]);
 if(G.founding){const spec=fs.filter(f=>f.spec).length;if(spec>1)I.push(['err',`Only one Specialist at founding (you have ${spec}).`])}
 if(cnt('daemon')){if(G.founding)I.push(['err','The Daemon cannot be recruited at gang creation.']);if(G.rep<8)I.push(['err','A Khorne Daemon needs 8 Rep.'])}
 const brutes=fs.filter(f=>FT[f.type].brute).length,maxB=1+Math.floor(Math.max(0,G.rep)/5);if(brutes>maxB)I.push(['err',`Rep ${G.rep} allows ${maxB} Brute/Hanger-On; you have ${brutes}.`]);
 const seen={};fs.forEach(f=>(f.items||[]).forEach(n=>seen[n]=(seen[n]||0)+1));
 Object.entries(seen).forEach(([n,k])=>{const e=EQ[n];if(!e)return;if(e.lim&&k>e.lim)I.push(['err',`${n}: gang limit ${e.lim} (you have ${k}).`]);if(e.rep&&G.rep<e.rep)I.push(['warn',`${n} needs Rep ${e.rep}.`])});
 fs.forEach(f=>{const T=FT[f.type],nm=f.name||T.n;const m=(f.muts||[]).length,st=stats(f);
  if(G.founding&&(m<T.mut[0]||m>T.mut[1])&&(T.mut[1]||m))I.push(['err',`${nm}: ${T.mut[0]===T.mut[1]?'no':T.mut[0]+'–'+T.mut[1]} Mutations at recruitment (has ${m}).`]);
  if(m>st.T)I.push(['err',`${nm} has more Mutations than Toughness – they become a Chaos Spawn.`]);
  if(m===st.T&&m)I.push(['warn',`${nm} is one Mutation from becoming a Chaos Spawn.`]);
  if((f.items||[]).filter(n=>n==='Familiar').length>1)I.push(['err',`${nm}: max 1 Familiar per fighter.`]);
  if(f.type==='mutant'&&!f.spec&&(f.items||[]).some(n=>EQ[n]&&EQ[n].cat==='special'))I.push(['warn',`${nm}: only a Mutant Specialist can use Special Weapons.`]);
  if(f.type==='cultist'&&!f.spec&&(f.items||[]).some(n=>EQ[n]&&['special','heavy'].includes(EQ[n].cat)))I.push(['warn',`${nm}: only a Cultist Specialist can use Special and Heavy Weapons.`]);
  if(T.wyrd&&!(f.wyrd||[]).length)I.push(['warn',`${nm}: pick a free Wyrd Power.`]);
  if(T.free&&!f.skills)I.push(['warn',`${nm}: pick a free Primary skill.`]);
  if((f.muts||[]).includes('Crooked Body')&&(f.items||[]).some(n=>EQ[n]&&EQ[n].cat==='armour'))I.push(['warn',`${nm}: Crooked Body can't wear armour.`]);
  if(f.psyker&&f.type==='apostle'&&G.rep<10)I.push(['err',`Psyker Apostle needs 10 Rep.`]);
 });
 if(!I.length)I.push(['ok','Roster is legal.']);return I}

 if(d.wyrd){const f=byUid(d.wyrd);f.wyrd=f.wyrd||[];if(t.checked)f.wyrd.push(t.value);else f.wyrd=f.wyrd.filter(x=>x!==t.value);commit()}
 if(d.spec){byUid(d.spec).spec=t.checked;commit()}
 if(d.psy){byUid(d.psy).psyker=t.checked;commit()}
 if(d.hand){const f=byUid(d.hand);f.hands=f.hands||['Open Fist','Open Fist'];f.hands[+d.h]=t.value;commit()}
 if(d.plate){byUid(d.plate).plate=t.checked;commit()}
});

function rosterText(){const L=[`${G.name} – Chaos Cult (Khorne), ${PATHS[G.path].n}`,`${gangCost()} / ${G.budget} credits · Rep ${G.rep}`,''];

  L.push('  '+STATK.map(k=>k+' '+fmt(k,s[k])).join(' | '));

 if(f.type==='chosen')n=2;if((f.items||[]).includes('Cult Icon'))n=Math.max(n,3);if(/hagiocracy/i.test(f.skills||''))n=Math.max(n,3);if(s.imp)n=Math.max(n,3);
 if(G.path==='vacillation'&&(FT[f.type].hier))n++;if(G.path==='destruction'&&s.eng)n++;return n}

 if(G.path==='degeneration'){const k=G.fighters.filter(f=>['si','ooa'].includes(fsOf(f).st)).length;if(k){n+=k;parts.push(`${k} for your fallen`)}}

app.addEventListener('click',e=>{if(!document.querySelector('.seg'))return;const el=e.target.closest('button');if(!el)return;const d=el.dataset;
 if(d.ptab){UI.play=d.ptab;saveUI();renderPlay();return}
 if(d.fw){const f=byUid(d.fw),s=fsOf(f);s.fw=Math.max(0,s.fw+(+d.d));if(s.fw>=stats(f).T&&s.st!=='ooa'){s.st='ooa';toast(`${f.name||FT[f.type].n} goes Out of Action`)}saveB();renderPlay();return}
 if(d.reveal){DK.shown=DK.shown||[];DK.shown.push(d.reveal);saveD();renderPlay();return}
 if(d.done){DK.hand=DK.hand.filter(x=>x!==d.done);DK.removed.push(d.done);DK.note='';saveD();renderPlay();return}
 if(d.back){DK.hand=DK.hand.filter(x=>x!==d.back);saveD();renderPlay();return}
 const b=d.b;if(!b)return;const arts=pathArts(G.path);
 if(b==='round+'){B.round++}if(b==='round-'){B.round=Math.max(1,B.round-1)}
 if(b==='pool+'){B.pool++}if(b==='pool-'){B.pool=Math.max(0,B.pool-1)}
 if(b==='n+'){B.useN=Math.min(B.pool,(B.useN||2)+1)}if(b==='n-'){B.useN=Math.max(1,(Math.min(B.useN||2,B.pool))-1)}
 if(b==='endphase'){const ep=endPhaseInfo();const dice=Array.from({length:ep.n},d6);const gain=dice.filter(v=>v>=ep.thr).length;B.pool+=gain;G.fighters.forEach(f=>fsOf(f).imp=false);B.last={kind:'end',dice,thr:ep.thr,gain}}
 if(b==='nextround'){B.round++;B.used={};B.last=null;toast(`Round ${B.round}`)}
 if(b==='reset'){playConfirm=true;renderPlay();return}
 if(b==='reset-no'){playConfirm=false;renderPlay();return}
 if(b==='reset-yes'){playConfirm=false;B={round:1,pool:0,used:{},fs:{},enemyOOA:0,enemyFW:0,bottled:false,last:null,art:B.art}}
 if(b==='invoke'){const A=arts.find(a=>a.id===(B.art&&arts.find(x=>x.id===B.art)?B.art:arts[0].id));const n=Math.min(B.useN||2,B.pool);if(!A||!n)return;
  const dice=Array.from({length:n},d6),total=dice.reduce((s,v)=>s+v,0),pass=total>=A.t;B.pool-=n;if(pass)B.used[A.id]=true;B.last={kind:'art',dice,total,t:A.t,pass,passT:A.pass,failT:A.fail}}
 if(b==='ritual'){const R=B.rit||{};const pool=G.fighters.filter(f=>f.type!=='apostle');const focus=G.fighters.find(f=>f.type==='scrunt')||pool[Math.floor(Math.random()*pool.length)];
  const dice=[d6(),d6()];let def=0,defName='';if(R.defile){const df=byUid(R.defile);if(df){def=1+Math.floor(Math.random()*3);defName=df.name||FT[df.type].n;const s=fsOf(df);s.fw=def;s.st='standing'}}
  const total=dice[0]+dice[1]+(R.won?1:0)+(R.gain?1:0)+(R.bleed?1:0)+1-(R.lost?1:0)-(R.rec?1:0)+def;
  B.ritRes={dice,def,defName,total,focus:focus?(focus.name||FT[focus.type].n):'–',xp:d6()}}
 if(b==='draw'){DK.note='';draw(1)}
 if(b==='returnall'){DK.hand=[];DK.note=''}
 if(b==='reshuffle'){DK.confirm=true}if(b==='reshuffle-no'){DK.confirm=false}if(b==='reshuffle-yes'){DK={removed:[],hand:[],note:'',shown:[]}}
 saveB();saveD();renderPlay()});
function draw(n){const all=[];Object.keys(SP).forEach(s=>RANKS.forEach(r=>all.push(s+'-'+r)));all.push('JK-1','JK-2');
 for(let i=0;i<n;i++){const avail=all.filter(c=>!DK.removed.includes(c)&&!DK.hand.includes(c)&&!(DK.jok||[]).includes(c));if(!avail.length){DK.note='The deck is empty.';return}
  const c=avail[Math.floor(Math.random()*avail.length)];if(c.startsWith('JK')){DK.jok=(DK.jok||[]).concat(c);DK.note='Joker! Show it to your opponent and discard it. Drawing two more…';draw(2);DK.jok=[];continue}DK.hand.push(c)}}
app.addEventListener('change',e=>{if(!document.querySelector('.seg'))return;const t=e.target,d=t.dataset;
 if(d.st){fsOf(byUid(d.st)).st=t.value}
 if(d.imp){fsOf(byUid(d.imp)).imp=t.checked}
 if(d.eng){fsOf(byUid(d.eng)).eng=t.checked}
 if(t.id==='b-art'){B.art=t.value;B.last=B.last&&B.last.kind==='end'?B.last:null}
 if(t.id==='b-eooa'){B.enemyOOA=Math.max(0,+t.value||0)}
 if(t.id==='b-efw'){B.enemyFW=Math.max(0,+t.value||0)}
 if(t.id==='b-bot'){B.bottled=t.checked}
 if(d.rit){B.rit=B.rit||{};B.rit[d.rit]=t.checked}
 if(t.id==='rit-def'){B.rit=B.rit||{};B.rit.defile=t.value}
 if(t.id==='rules-q')return;
 saveB();if(document.querySelector('.seg'))renderPlay()});

/* ============================== RULES ============================== */
function renderRules(){const tbl=(heads,rows,cls='')=>`<div class="scroll"><table class="dt ${cls}"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
 const rb=(t,body,wide)=>`<div class="rb ${wide?'wide':''}">${t?`<h3>${t}</h3>`:''}${body}</div>`;
 const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 const S=[];
 S.push(['gang','Gang rules',[
  rb('Founding the gang',ul(['Recruit only 2 Champions at the start. Leaders and Champions may never outnumber fighters with the Gang Fighter (X) rule (Gangers, Prospects, Juves).','The gang is dedicated to the Lord of Skin and Sinew and chooses a Path of Damnation.','A fighter with more Mutations than their Toughness turns into a Chaos Spawn.','Some items are limited across the gang (0-X) or need Reputation (X) before they can be bought.'])),
  rb('Chaos Cult rules',ul(['<strong>Limited Supply:</strong> every ranged weapon a Chaos Cult fighter uses counts as Scarce. Restricted items can’t be bought until their limits and Rep are met.','<strong>Outcast:</strong> Trading Post Rarity +2 on everything, plus a 25% handling charge on the total.','<strong>Ostracised:</strong> restricted Brutes and Hangers-On. Always Outlaw; can’t change Alignment.','<strong>Infernal Pacts:</strong> on activation, a fighter with Blaze and/or Insane may remove them, then suffers D2 Flesh Wounds at the end of the activation.','<strong>Vows of the Void:</strong> choose an Unholy Dedication and then a Path of Damnation at founding.'])),
  rb('Brutes and Hangers-On',`<p>Total allowed by Reputation: 0–5 Rep: 1 · 5–9: 2 · 10–14: 3 · 15–19: 4 · 20–24: 5 · +1 per further 5 Rep.</p>`+ul(['<strong>Brutes:</strong> Corrupted Ogryn, Daemon, Iron Automata, Awakened Ogryn, Outlands Beastmaster, Sump Beast.','<strong>Hangers-On:</strong> Agitator, Cadaver Merchant, Chem Dealer, Heretek (no starting weapons or armour; Cultist Specialist equipment access), Propagandist, Rogue Doc, Scabber.','The book also says they “may never use Articles of Damnation” – most likely meaning hired Brutes and Hangers-On can’t invoke Articles.'])),
 ]]);
 S.push(['fighters','Fighters',ORDERF().map(t=>{const T=FT[t],b=baseStats(t),k=stats({type:t,muts:[]});const rules=T.rules.slice();if(T.mark)rules.push('Mark of Khorne');
  return rb(`${T.n} <span class="pill">${T.role} · ${T.cost} cr${T.max<99?' · 0-'+T.max:''}</span>`,`${statTable(b)}${T.mark?`<p class="label">With Mark of Khorne</p>${statTable(k,b)}`:''}<p style="font-size:.9rem">${esc(T.equip)}</p><p style="font-size:.9rem"><strong>Primary:</strong> ${T.P.join(', ')} · <strong>Secondary:</strong> ${T.S.join(', ')}</p>${t==='daemon'?wtable([['Vorpal Claws',WP['Vorpal Claws']],['Warpfire Breath',WP['Warpfire Breath']]]):''}${t==='ogryn'?wtable(['Open Fist','Power Maul','Horrific Appendages'].map(n=>[n,WP[n]])):''}<div class="stack" style="gap:4px">${rules.map(n=>`<p style="font-size:.9rem"><strong>${esc(n)}:</strong> ${esc(RULES[n])}</p>`).join('')}</div>`)}).concat([
  rb('Familiar <span class="pill">Exotic Beast · 65 cr on the lists · 0-3</span>',`<p style="font-size:.9rem">${esc(EQD.Familiar)} Max 1 per fighter. No equipment, unarmed attacks only.</p>${['Clamber','Omen of Fortune','Precognition'].map(n=>`<p style="font-size:.9rem"><strong>${n}:</strong> ${esc(RULES[n])}</p>`).join('')}`),
  rb('Chaos Spawn <span class="pill">Unique</span>',`<p style="font-size:.9rem">Gained only when a fighter transforms. Free; adds 130 to Gang Rating. M D3+3". Roll a D6 per X: 1 – WS4+ S3 T4 W1 I5+ A1 (32mm); 2–5 – WS4+ S4 T5 W2 I4+ A2 (40/50mm); 6 – WS3+ S5 T6 W3 I3+ A3 (60mm).</p>`+ul(['<strong>Lost and Damned:</strong> the old fighter is removed; weapons go to the Stash, equipment is lost. The Spawn sits outside the gang structure.','<strong>Mindless Beast:</strong> only Move, Charge, Fight and Coup de Grace.','<strong>Warped Monstrosity:</strong> never Pinned or Broken, immune to Insane, auto-passes Cool and Willpower, auto-fails Leadership and Intelligence. Flesh Wound = No Effect, Serious Injury = Flesh Wound. Only Memorable Death as Lasting Injury.','<strong>Restraining the Spawn:</strong> after a battle, nominate 0–3 Gangers or Juves who weren’t OOA or SI; roll a D6 each. Any 4+ restrains it, otherwise it escapes. A 1 gives that fighter a Lasting Injury.'])),
 ])]);
 S.push(['equipment','Equipment lists',[rb('',`<p class="muted" style="font-size:.88rem">✓ = on that fighter's list. 0-X = gang limit. Rep = Reputation needed.</p>`+tbl(['Item','Cost','Limit','Rep',...WHO.map(w=>w[1])],CATS.flatMap(([cat,lab])=>[`<tr class="grp"><td colspan="${4+WHO.length}">${lab}</td></tr>`,...EQL.filter(e=>e[2]===cat).map(e=>{const E=EQ[e[0]];return `<tr><td>${esc(E.n)}</td><td class="c">${E.c}</td><td class="c">${E.lim?'0-'+E.lim:''}</td><td class="c">${E.rep||''}</td>${WHO.map(w=>`<td class="c">${E.who.includes(w[0])?'<span class="tick">✓</span>':''}</td>`).join('')}</tr>`})])),true)]]);
 S.push(['armoury','Armoury',WPG.map(([lab,names])=>rb(lab,tbl(['Weapon','Rng S','Rng L','Acc S','Acc L','Str','AP','D','Am','Traits'],names.map(n=>`<tr><td><strong>${esc(n)}</strong></td>${WP[n].slice(0,8).map(v=>`<td class="c">${esc(v)}</td>`).join('')}<td>${esc(WP[n][8])}</td></tr>`)),true)).concat([
  rb('Armour',ul(['Flak Armour','Gutterforged Cloak','Mesh Armour','Plate Mail','Scrap Shield','Boarding Shield','Mantle Malifica','Ablative Overlay','Refractor Field'].map(n=>`<strong>${n}:</strong> ${esc(EQD[n])}`).concat(['<strong>Light Carapace Armour:</strong> 4+ save.']))),
  rb('Equipment',ul(['Cult Icon','Drop Rig','Filter Plugs','Photo-Goggles','Respirator','Skinblade','Strip Kit','Cred Sniffer','Armoured Undersuit','Exotic Furs','Opulent Jewellery','Uphive Raiments','Forged Guilder Seal','Hexagrammatic Fetish','Data Thief','Mono-Sight'].map(n=>`<strong>${n}:</strong> ${esc(EQD[n])}`).concat(['<strong>Book of Desecration:</strong> Words of Chaos (Basic) – until the next End Phase, friendly Chaos Cult fighters within 6" at the start of their activation may re-roll the D3 for a Charge, or one natural 1 to hit.']))),
 ])]);
 S.push(['mutations','Mutations',[rb('',`<p style="font-size:.9rem">Bought at recruitment where the profile allows, or gained through the Mutation skill set (with XP; one free when added to the roster).</p>`+tbl(['D66','Mutation','Effect','Cr'],MUTL.map(m=>`<tr><td class="c">${m[0]}</td><td><strong>${m[1]}</strong></td><td>${esc(m[3])}</td><td class="c">${m[2]}</td></tr>`)),true)]]);
 S.push(['wyrd','Wyrd Powers',[rb('Aetheric Discipline',ul(['<strong>Sorcerer:</strong> access from recruitment; first power free, +30 each extra at recruitment.','<strong>Apostle:</strong> Psyker upgrade for 30 credits at 10 Rep – random power and Unsanctioned Psyker.','<strong>Daemon:</strong> Psyker upgrade for 30 credits at recruitment – random power and Unsanctioned Psyker.','Advancement: random power 9 XP, chosen power 12 XP. No limit.'])+tbl(['D6','Power','Type','Effect'],WYRD.map((w,i)=>`<tr><td class="c">${i+1}</td><td><strong>${w[0]}</strong></td><td>${w[1]}</td><td>${esc(w[2])}</td></tr>`)),true)]]);
 S.push(['skills','Skills',[rb('Skill access – Lord of Skin and Sinew',tbl(['Fighter',...['Agi','Bra','Com','Cun','Fer','Lea','Sho','Sav','Svg','Her','Mut']],KTABLE.map(([n,r])=>`<tr><td><strong>${n}</strong></td>${r.map(v=>`<td class="c">${v==='P'?'<span class="tick">P</span>':v}</td>`).join('')}</tr>`))+`<p class="muted" style="font-size:.85rem">Agility, Brawn, Combat, Cunning, Ferocity, Leadership, Shooting, Savant, Savagery, Heresy, Mutation. P = Primary, S = Secondary.</p>`,true),
  rb('Heresy',`<ol>${HERESY.map(h=>`<li><strong>${h[0]}:</strong> ${esc(h[1])}</li>`).join('')}</ol>`),
  rb('Savagery',`<ol>${SAVAGERY.map(h=>`<li><strong>${h[0]}:</strong> ${esc(h[1])}</li>`).join('')}</ol>`)]]);
 S.push(['dedication','Dedication & Mark',[rb('The Lord of Skin and Sinew',ul(['The Gang Leader and Champions gain the Mark of Khorne (so does the Daemon).','Rituals may seek the favour of Khorne.','Invoking an Article: a Threshold roll of 8 or a multiple of 8 gives the fighter +2 XP.','The dedication can’t change without the Arbitrator’s permission.'])),
  rb('The Mark of Khorne',ul(['<strong>Martial:</strong> +1 Weapon Skill, +2 Cool.','<strong>Frenzied:</strong> −2 Ballistic Skill.','<strong>Eternal Rivalry:</strong> Hatred (The Mark of Slaanesh).','<strong>Hatred (X):</strong> must re-roll failed wound rolls in melee against fighters they hate.']))]]);
 S.push(['articles','Articles of Damnation',[rb('How they work',ul(['The Leader picks a Path at founding. It is permanent unless the Leader is replaced.','End Phase: D6 for every friendly fighter not Seriously Injured or Broken; each 5+ adds a Delusion Die. The pool carries over between rounds.','Beseech the Gods of Chaos (Double): the fighter becomes Impassioned and rolls three D6 in the End Phase.','Invoke at the start of an activation (no action, needs at least one die): commit dice, roll, total ≥ Threshold passes. Dice are discarded either way.','An Article affects only the invoking fighter until the start of their next activation, unless stated.','Any number of attempts, but a passed Article can’t be invoked again that round.'])),
  ...PATHKEYS.map(k=>{const P=PATHS[k];return rb(P.n,`<p class="muted" style="font-size:.9rem">${esc(P.blurb)}</p><p style="font-size:.9rem"><strong>Gang benefit:</strong> ${esc(P.benefit)}</p><div class="arts">${pathArts(k).map(a=>`<div class="art"><h4>(${a.num}) “${esc(a.n)}” <span class="thr">${a.t}+</span></h4><p>${esc(a.pass)}</p><p class="f">Fail: ${esc(a.fail)}</p></div>`).join('')}</div>`,true)})]]);
 S.push(['rituals','Ritual of Blood',[rb('Dark Ritual pre-battle action',`<ol><li>Before crews are chosen, seek the favour of the Lord of Skin and Sinew.</li><li>Randomly pick one gang member (not the Leader) as the focus. You may Bleed the Captive and/or Defile a fighter.</li><li>Roll 2D6: +1 won last battle, +1 gained Rep, +1 Captive bled, +1 matching dedication (always), −1 lost Rep, −1 Leader in Recovery.</li><li><strong>Bleed the Captive:</strong> +1; the captive rolls a Lasting Injury of 50+D6, is placed within 12" of the centre; enemies within 1" can Free Captive (Simple) – pass Intelligence to capture, fail and the captive returns Humiliated.</li><li><strong>Defilement:</strong> a fighter in the crew starts with D3 Flesh Wounds; +1 per wound.</li><li><strong>9+:</strong> Khorne's favour for one battle; the focus gains +D6 XP. <strong>4 or less:</strong> the focus becomes a Chaos Spawn.</li></ol>`),
  rb('Favour bestowed',ul(['<strong>Blessing:</strong> once per round, re-roll one failed Wound roll.','<strong>Boon:</strong> the Gang Leader gains +1 Attack.','<strong>Warped:</strong> Chaos Spawn gain +1 Strength.']))]]);
 S.push(['subplots','Sub-plots',[rb('Using sub-plots',ul(['Agree before the battle. Each player privately draws one card from a deck of playing cards.','A Joker is shown and discarded; draw two cards instead (repeat for more Jokers).','On completion reveal it, take the reward, and discard the card permanently.'])),
  ...Object.values(SP).map(s=>rb(`${s.sym} ${s.suit}: ${s.theme} <span class="pill">${s.reward}</span>`,tbl(['Card','Sub-plot','Condition and reward'],s.c.map((c,i)=>`<tr><td class="c">${RANKS[i]}</td><td><strong>${esc(c[0])}</strong></td><td>${esc(c[1])}</td></tr>`)),true))]]);
 app.innerHTML=`<div class="codex"><nav class="toc" aria-label="Contents">${S.map(([id,t])=>`<a href="#rules" data-jump="${id}">${t}</a>`).join('')}</nav>
 <div><input type="search" class="search" id="rules-q" placeholder="Search the rules – e.g. Frenzy, Scarce, Daemon" value="${esc(UI.rules||'')}" aria-label="Search rules"><div style="height:18px"></div>
 ${S.map(([id,t,blocks])=>`<section class="csec" id="sec-${id}"><h2>${t}</h2>${blocks.join('')}</section>`).join('')}<p class="muted" id="noresults" hidden>Nothing matches that search.</p></div></div>`;
 filterRules()}
function filterRules(){const q=(UI.rules||'').trim().toLowerCase();let any=false;document.querySelectorAll('.csec').forEach(sec=>{let vis=false;
 sec.querySelectorAll('.rb').forEach(b=>{let show=!q||b.textContent.toLowerCase().includes(q);
  if(q&&show){b.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hidden-by-search',!tr.textContent.toLowerCase().includes(q)&&!tr.classList.contains('grp')&&!b.querySelector('h3')?.textContent.toLowerCase().includes(q)))}else b.querySelectorAll('tbody tr').forEach(tr=>tr.classList.remove('hidden-by-search'));
  b.classList.toggle('hidden-by-search',!show);if(show)vis=true});sec.classList.toggle('hidden-by-search',!vis);if(vis)any=true});
 const nr=document.getElementById('noresults');if(nr)nr.hidden=any}
